<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watch the animated shorts</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101824;color:#e8edf6;font:16px/1.5 'Trebuchet MS',sans-serif}main{max-width:1100px;margin:auto;padding:24px;text-align:center}h1{font-size:28px;margin:8px}video{display:block;max-height:76vh;max-width:100%;aspect-ratio:9/16;background:#172235;margin:20px auto;border:1px solid #536783;border-radius:5px}a{color:#9ac4ff}nav{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}button{font:inherit;border:1px solid #607d9d;background:#24466c;color:#fff;border-radius:4px;padding:9px 18px;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #efbf70;outline-offset:4px}p{color:#b0bdd0}#hint:empty{display:none}</style><main><nav><a href="index.html">Production journal</a><a href="https://github.com/az9713/claude-animated-shorts">GitHub README</a></nav><h1 id="title">Watch the animated shorts</h1><video id="player" controls playsinline preload="metadata"></video><button id="play">Play with sound</button><p id="hint"></p><nav><a href="?video=sunset">Sunset</a><a href="?video=magnet">Magnet</a><a href="?video=smalls">Robert Smalls</a></nav></main><script>const clips={sunset:{title:'Sunset style test',file:'01-sunset-style-test.mp4'},magnet:{title:'The Magnet That Fell in Slow Motion',file:'02-magnet-slow-motion-60s.mp4'},smalls:{title:'The Captain’s Hat — Robert Smalls',file:'03-robert-smalls-60s.mp4'}};const id=new URLSearchParams(location.search).get('video')||'sunset',clip=clips[id]||clips.sunset,v=document.getElementById('player'),b=document.getElementById('play');document.getElementById('title').textContent=clip.title;document.title=clip.title;v.poster='screenshots/'+(clips[id]?id:'sunset')+'.jpg';v.src=clip.file;b.onclick=()=>{v.muted=false;v.play().then(()=>document.getElementById('hint').textContent='').catch(()
